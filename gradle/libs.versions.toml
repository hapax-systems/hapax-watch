[versions]
agp = "8.7.3"
kotlin = "2.3.20"
compose-bom = "2025.02.00"
wear-compose = "1.5.0"
health-services = "1.1.0-alpha05"
tiles = "1.5.0"
protolayout = "1.3.0"
okhttp = "4.12.0"
datastore = "1.1.2"
coroutines = "1.9.0"
junit = "5.11.4"
kotlinx-serialization = "1.7.3"

[libraries]
wear-compose-material = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
health-services = { module = "androidx.health:health-services-client", version.ref = "health-services" }
tiles = { module = "androidx.wear.tiles:tiles", version.ref = "tiles" }
tiles-material = { module = "androidx.wear.tiles:tiles-material", version.ref = "tiles" }
protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
protolayout-material = { module = "androidx.wear.protolayout:protolayout-material", version.ref = "protolayout" }
protolayout-expression = { module = "androidx.wear.protolayout:protolayout-expression", version.ref = "protolayout" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
datastore-prefs = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version = "2.8.7" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
